name: CMake Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev libexiv2-dev
      - name: Configure
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          "VCPKG_INSTALLATION_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          & "${{ env.VCPKG_INSTALLATION_ROOT }}\vcpkg.exe" install exiv2 opencv
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install exiv2 opencv
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}\scripts\buildsystems\vcpkg.cmake
      - name: Build
        run: cmake --build build --config Release
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: Windows Release v${{ github.sha }}

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          brew install cmake qt opencv exiv2
      - name: Configure
        run: cmake -B build -S . -DQt5_DIR=$(brew --prefix qt)/lib/cmake/Qt5
      - name: Build
        run: cmake --build build --config Release
      - name: Package DMG
        run: |
          mkdir -p dmgdir
          cp build/photo_editor dmgdir/
          hdiutil create photo_editor.dmg -fs HFS+ -srcfolder dmgdir
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-dmg
          path: photo_editor.dmg
