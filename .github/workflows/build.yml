name: CMake Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libopencv-dev libexiv2-dev
      - name: Configure
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build

  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          "VCPKG_INSTALLATION_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          & "${{ env.VCPKG_INSTALLATION_ROOT }}\vcpkg.exe" install exiv2 opencv
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install exiv2 opencv
      - name: Configure
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}\scripts\buildsystems\vcpkg.cmake
      - name: Build
        run: cmake --build build --config Release
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: Windows Release v${{ github.sha }}

  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          brew update
          brew install cmake opencv exiv2
      - name: Configure
        run: cmake -B build -S .
      - name: Build
        run: cmake --build build --config Release
      - name: Package dmg
        run: |
          mkdir -p dist
          cp build/photo_editor dist/
          hdiutil create photo_editor.dmg -volname PhotoEditor -srcfolder dist -ov -format UDZO
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.sha }}
          name: macOS Release v${{ github.sha }}
          files: photo_editor.dmg
